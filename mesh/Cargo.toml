[package]
name = "mesh"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Kubernetes operator that establishes and reconciles the AmneziaWG mesh between cluster nodes"

[[bin]]
name = "mesh"
path = "src/main.rs"

[[bin]]
name = "mesh-crdgen"
path = "src/bin/crdgen.rs"

[[bin]]
name = "mesh-rbacgen"
path = "src/bin/rbacgen.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
futures.workspace = true
k8s-openapi.workspace = true
kube.workspace = true
netlink-packet-amnezia-wireguard.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
common.workspace = true
slipmesh-core.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
