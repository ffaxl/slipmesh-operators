# Triggered by the `vX.Y.Z` tag pushed after a release PR merge. Builds each operator for
# amd64+arm64 and pushes a multi-arch manifest to GHCR under ghcr.io/<repo>/<operator>, tagged
# with the release version and `latest`.
#
# Cross-compiles via cargo-zigbuild (a true cross-compiler, no emulation) instead of letting
# buildx run `cargo build` under QEMU for the arm64 leg - a full rustc build segfaults under QEMU
# (see each operator's Dockerfile). Each operator/arch combination is built and pushed by digest
# first (`build`), then merged into one multi-arch manifest per operator (`merge`) - the standard
# pattern for combining per-arch images built in separate jobs.
name: Release images

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        op: [mesh, router, roadwarriors, nftables]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            rust_target: x86_64-unknown-linux-musl
          - arch: arm64
            rust_target: aarch64-unknown-linux-musl
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.op }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.op }}-${{ matrix.rust_target }}

      - uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Cross-compile
        run: cargo zigbuild --release --target ${{ matrix.rust_target }} -p ${{ matrix.op }}

      # Docker's own TARGETARCH build arg (auto-populated from --platform below) uses
      # amd64/arm64, not Rust's target-triple naming - matrix.arch already matches it exactly
      # (see the matrix definition above), so the Dockerfiles read straight from this path with no
      # separate, manually-passed build-arg that would need to stay in sync with --platform on
      # its own.
      - name: Stage binary at its TARGETARCH path
        run: |
          mkdir -p target/${{ matrix.arch }}/release
          cp target/${{ matrix.rust_target }}/release/${{ matrix.op }} target/${{ matrix.arch }}/release/

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.op }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.op }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        op: [mesh, router, roadwarriors, nftables]
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.op }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.op }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:${{ github.ref_name }}" \
            -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)
