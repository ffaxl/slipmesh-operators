name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: build
        run: cargo build --workspace

  # Separate job (not folded into `check`) so a secret/advisory hit is unambiguous in the PR
  # checks list, rather than buried in the same log as an unrelated clippy/test failure.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans the full commit history by default, not just the working tree - a
          # shallow checkout would only let it see the single most recent commit.
          fetch-depth: 0

      # Free for personal-account repos (gitleaks' commercial license only applies to GitHub
      # Organizations) - see https://github.com/gitleaks/gitleaks-action for the org case.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # RUSTSEC advisory-db check against Cargo.lock - dependency CVEs/unmaintained-crate
      # warnings, not our own code. Plain `cargo audit` rather than the rustsec/audit-check
      # action: that action needs issues:write/checks:write to post results back via the GitHub
      # API, which the repo's own default Actions permission setting can cap regardless of what
      # this workflow requests ("Resource not accessible by integration") - a plain CLI run
      # avoids needing any elevated permissions at all. Exit code alone gates the job: cargo
      # audit's default policy only fails on an actual vulnerability, not an "unmaintained crate"
      # notice.
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
