[package]
name = "common"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared CRD types, netlink helpers, pool allocation, and reconcile plumbing used by every operator"

[dependencies]
anyhow.workspace = true
base64.workspace = true
futures.workspace = true
genetlink.workspace = true
k8s-openapi.workspace = true
kube.workspace = true
netlink-packet-amnezia-wireguard.workspace = true
netlink-packet-core.workspace = true
netlink-packet-generic.workspace = true
netlink-packet-route.workspace = true
rtnetlink.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing.workspace = true
# Only used for two mechanical wire-format operations, never protocol logic of our own: deriving
# a public key from an already-existing private key (X25519 scalar mult, `public = private *
# basepoint`) and generating a fresh private key on first boot.
x25519-dalek = { version = "3.0.0", default-features = false, features = ["static_secrets", "getrandom"] }
getrandom = { version = "0.4.3", features = ["sys_rng"] }
