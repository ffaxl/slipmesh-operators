[package]
name = "roadwarriors"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Kubernetes operator that terminates road-warrior AmneziaWG client connections"

[[bin]]
name = "roadwarriors"
path = "src/main.rs"

[[bin]]
name = "roadwarriors-crdgen"
path = "src/bin/crdgen.rs"

[[bin]]
name = "roadwarriors-rbacgen"
path = "src/bin/rbacgen.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
futures.workspace = true
k8s-openapi.workspace = true
kube.workspace = true
netlink-packet-amnezia-wireguard.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
common.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
